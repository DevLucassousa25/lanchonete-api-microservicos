# API Gateway: um único ponto de entrada (http://localhost:8080) que roteia para cada serviço.
# Os caminhos externos são os mesmos dos serviços internos (sem prefixo extra).

map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;          # gera um ID se o cliente não mandou (rastreio entre serviços)
}

server {
    listen 80;
    client_max_body_size 1m;

    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $req_id;
    add_header       X-Request-Id      $req_id always;

    # ---------- Contas: login, cadastro, perfil, endereços, clientes ----------
    location /api/auth/     { proxy_pass http://contas:8000; }
    location /api/me        { proxy_pass http://contas:8000; }
    location /api/clientes  { proxy_pass http://contas:8000; }

    # ---------- Catálogo: cardápio, categorias, produtos, preços ----------
    location = /api/produtos/cotacao {                # rota interna (só o serviço de pedidos usa)
        default_type application/json;
        return 404 '{"message":"Rota não encontrada."}';
    }
    location /api/cardapio   { proxy_pass http://catalogo:8000; }
    location /api/categorias { proxy_pass http://catalogo:8000; }
    location /api/produtos   { proxy_pass http://catalogo:8000; }

    # ---------- Pedidos e cozinha ----------
    location /api/pedidos { proxy_pass http://pedidos:8000; }
    location /api/cozinha { proxy_pass http://pedidos:8000; }

    # ---------- Pagamentos ----------
    location /api/pagamentos { proxy_pass http://pagamentos:8000; }
    location /api/webhooks/  { proxy_pass http://pagamentos:8000; }

    # ---------- Documentação (Swagger UI) ----------
    location = /           { return 302 /docs/; }
    location /docs/        { alias /usr/share/nginx/docs/; index index.html; }

    location /api/ {
        default_type application/json;
        return 404 '{"message":"Rota não encontrada. Veja a documentação em /docs"}';
    }
}
